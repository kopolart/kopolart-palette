name: Feature request
description: Suggest an improvement for Kopolart Palette.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
      placeholder: When I design a theme, I need...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or tools you have tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Palette extraction
        - Color data (names, wavelength, purity)
        - Contrast and accessibility
        - Saved palettes
        - Export and clipboard
        - Interface and localization
        - Permissions and privacy
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request fits the extension's single purpose of extracting and inspecting page colors.
          required: true
