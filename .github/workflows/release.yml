name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run repository checks
        run: node scripts/check.mjs

      - name: Verify tag matches manifest version
        run: |
          VERSION=$(node -p "require('./src/manifest.json').version")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${VERSION}" >&2
            exit 1
          fi

      - name: Build extension archive
        run: |
          VERSION=$(node -p "require('./src/manifest.json').version")
          mkdir -p dist
          cd src
          zip -r "../dist/kopolart-palette-${VERSION}.zip" . \
            -x "*.DS_Store" "*__MACOSX*" "*/.git*"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "Kopolart Palette ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
